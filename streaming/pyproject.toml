[project]
name = "streaming"
version = "0.1.0"
description = "Spark Structured Streaming jobs: Bronze CDC ingestion and Silver facts/SCD2 dimensions"
requires-python = ">=3.11,<3.12"
dependencies = [
    "delta-spark==3.3.3",
    "pyspark==3.5.9",
]

[build-system]
requires = ["uv_build>=0.9,<0.11"]
build-backend = "uv_build"
