# Shared Spark settings for every job (SPARK_CONF_DIR points here inside the image).
# Credentials are not here: S3A reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the env.

# Delta Lake
spark.sql.extensions                         io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog              org.apache.spark.sql.delta.catalog.DeltaCatalog

# Hive Metastore as the shared catalog (ADR-005)
spark.sql.catalogImplementation              hive
spark.hadoop.hive.metastore.uris             thrift://hive-metastore:9083
spark.sql.warehouse.dir                      s3a://lakehouse/warehouse

# S3A -> MinIO
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# Behaviour
spark.sql.session.timeZone                   UTC
spark.ui.showConsoleProgress                 false

# Sized for a laptop, not a cluster: tables are small and each job gets 2 cores (SPARK_MASTER).
# Delta rebuilds table state from its log in snapshotPartitions tasks (default 50): with tiny
# tables that is ~50 near-empty tasks per commit, which dominated micro-batch time.
spark.sql.shuffle.partitions                 4
spark.databricks.delta.snapshotPartitions    2
