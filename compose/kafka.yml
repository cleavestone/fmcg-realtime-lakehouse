# Single-node Kafka in KRaft mode + Kafka UI (profiles: kafka, cdc). See ADR-001.
# No env_file here: the apache/kafka image turns every KAFKA_* variable into a broker
# property, so only the explicit settings below reach the container.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

services:
  kafka:
    image: ${KAFKA_IMAGE:?set KAFKA_IMAGE in .env}
    profiles: [kafka, cdc]
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID in .env}
      # One process is both broker and KRaft controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly (Kafka Connect topic.creation.*), never by typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      # Single broker: internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [fmcg-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${KAFKA_MEM_LIMIT:-1g}
    logging: *logging

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:?set KAFKA_UI_IMAGE in .env}
    profiles: [kafka, cdc]
    environment:
      KAFKA_CLUSTERS_0_NAME: fmcg
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Shows connectors in the UI once the cdc profile is up (harmless when it isn't).
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: fmcg-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: ${KAFKA_UI_JAVA_OPTS:--Xmx256m}
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [fmcg-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${KAFKA_UI_MEM_LIMIT:-512m}
    logging: *logging
