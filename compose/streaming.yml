# Spark streaming jobs (profile: streaming), one job per container, Spark in local mode.
# Compose restarts a crashed job; its checkpoint on MinIO makes it resume exactly where it
# stopped. spark-tools (profile: tools) runs one-off lake tools; spark-test (profile: test)
# runs the Spark unit tests in the same image.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}

x-spark-build: &spark-build
  context: ..
  dockerfile: streaming/Dockerfile
  args:
    PYTHON_IMAGE: ${PYTHON_IMAGE:?set PYTHON_IMAGE in .env}
    UV_IMAGE: ${UV_IMAGE:?set UV_IMAGE in .env}

x-spark-env: &spark-env
  AWS_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY:?set LAKE_ACCESS_KEY in .env}
  AWS_SECRET_ACCESS_KEY: ${LAKE_SECRET_KEY:?set LAKE_SECRET_KEY in .env}
  SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
  SPARK_MASTER: ${SPARK_MASTER:-local[2]}
  # glibc gives every JVM thread its own malloc arena; capping them stops native memory
  # fragmentation from pushing the container towards its limit.
  MALLOC_ARENA_MAX: 2

# Shared by the long-running streaming jobs.
x-spark-job: &spark-job
  image: fmcg/spark:local
  build: *spark-build
  profiles: [streaming]
  networks: [fmcg-net]
  restart: unless-stopped
  stop_grace_period: 30s
  deploy:
    resources:
      limits:
        memory: ${SPARK_MEM_LIMIT:-2g}
  logging: *logging

services:
  spark-bronze:
    <<: *spark-job
    command: ["python", "-m", "streaming.bronze.ingest_cdc"]
    environment:
      <<: *spark-env
      SPARK_UI_PORT: 4040
      BRONZE_TRIGGER_SECONDS: ${BRONZE_TRIGGER_SECONDS:-30}
      BRONZE_MAX_OFFSETS_PER_TRIGGER: ${BRONZE_MAX_OFFSETS_PER_TRIGGER:-50000}
    ports:
      - "4040:4040"   # Spark UI
    depends_on:
      kafka:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4040/api/v1/applications > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  spark-silver-facts:
    <<: *spark-job
    command: ["python", "-m", "streaming.silver.upsert_facts"]
    environment:
      <<: *spark-env
      SPARK_UI_PORT: 4041
      SILVER_TRIGGER_SECONDS: ${SILVER_TRIGGER_SECONDS:-30}
    ports:
      - "4041:4041"   # Spark UI
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Silver reads Bronze's Delta tables (it waits for them to exist on a fresh start).
      spark-bronze:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4041/api/v1/applications > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  spark-silver-dims:
    <<: *spark-job
    command: ["python", "-m", "streaming.silver.scd2_dimensions"]
    environment:
      <<: *spark-env
      SPARK_UI_PORT: 4042
      SILVER_TRIGGER_SECONDS: ${SILVER_TRIGGER_SECONDS:-30}
    ports:
      - "4042:4042"   # Spark UI
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      spark-bronze:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4042/api/v1/applications > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  # One-off lake tools: make bronze-check | spark-sql | spark-shell | reconcile | scd2-check.
  # Postgres access (reconcile only) uses the read-only Debezium user.
  spark-tools:
    image: fmcg/spark:local
    build: *spark-build
    profiles: [tools]
    environment:
      <<: *spark-env
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PG_READ_USER: ${DEBEZIUM_DB_USER:?set DEBEZIUM_DB_USER in .env}
      PG_READ_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?set DEBEZIUM_DB_PASSWORD in .env}
    networks: [fmcg-net]
    restart: "no"
    deploy:
      resources:
        limits:
          memory: ${SPARK_MEM_LIMIT:-2g}
    logging: *logging

  spark-test:
    image: fmcg/spark:test
    build:
      <<: *spark-build
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?set PYTHON_IMAGE in .env}
        UV_IMAGE: ${UV_IMAGE:?set UV_IMAGE in .env}
        INSTALL_TEST: "true"
    profiles: [test]
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "-q", "streaming/tests"]
    volumes:
      - ../streaming/tests:/app/streaming/tests:ro
    networks: [fmcg-net]
    restart: "no"
    deploy:
      resources:
        limits:
          memory: ${SPARK_MEM_LIMIT:-2g}
    logging: *logging
