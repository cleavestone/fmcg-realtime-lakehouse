[project]
name = "simulator"
version = "0.1.0"
description = "FMCG OLTP seed loader and business event simulator"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faker==40.40.0",
    "psycopg[binary]==3.3.6",
    "pyyaml==6.0.3",
    "typer==0.27.2",
]

[build-system]
requires = ["uv_build>=0.9,<0.11"]
build-backend = "uv_build"
